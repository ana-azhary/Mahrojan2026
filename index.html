<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Baan English Landa — 真实课程追踪系统</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A;--ink:#0F172A;--muted:#64748B;
  --line:#E2E8F0;--amber:#F59E0B;--amber2:#FBBF24;
  --emerald:#10B981;--rose:#F43F5E;--sky:#0EA5E9;
  --shadow:0 10px 30px -12px rgba(15,23,42,.25);
  --shadow-lg:0 25px 50px -12px rgba(15,23,42,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F8FAFC;color:var(--ink);font-family:'Inter','Noto Sans Thai',system-ui,sans-serif;line-height:1.6}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.icon{width:20px;height:20px;stroke-width:2;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.container{max-width:1240px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.nav .container{display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--amber),#EA580C);border-radius:10px;display:grid;place-items:center;color:#fff}
.brand-mark svg{width:20px;height:20px;stroke:#fff}
.nav-back{display:flex;align-items:center;gap:6px;color:#475569;font-weight:600;font-size:14px;padding:8px 14px;border-radius:9px;transition:.2s}
.nav-back:hover{background:#F1F5F9}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;background:#F1F5F9;border-radius:99px;font-size:13.5px;font-weight:600}
.user-chip .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#8B5CF6,var(--sky));display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}

.classroom{display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 64px)}
@media(max-width:1000px){.classroom{grid-template-columns:1fr}}
.stage{background:#0B1220;padding:24px;display:flex;flex-direction:column;gap:20px}
.player-wrap{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;box-shadow:var(--shadow-lg)}
.player-wrap iframe{width:100%;height:100%;border:0;display:block}
.player-skeleton{position:absolute;inset:0;background:linear-gradient(135deg,#1E293B,#0F172A);display:grid;place-items:center;color:#94A3B8;font-size:14px;gap:12px;flex-direction:column}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--amber);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.yt-fallback{position:absolute;bottom:14px;right:14px;background:rgba(15,23,42,.9);color:#fff;padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;backdrop-filter:blur(8px);z-index:5}
.yt-fallback:hover{background:var(--rose)}

.lesson-info{background:#fff;border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.lesson-info .crumb{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
.lesson-info h1{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:10px}
.lesson-info .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:16px}
.lesson-info .meta span{display:flex;align-items:center;gap:6px}
.lesson-info .meta svg{width:15px;height:15px}
.lesson-info .desc{font-size:14.5px;color:#334155;line-height:1.7;padding-top:16px;border-top:1px solid var(--line)}

.progress-strip{background:#fff;border-radius:16px;padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.progress-strip .bar{flex:1;min-width:200px;height:10px;background:#F1F5F9;border-radius:99px;overflow:hidden;position:relative}
.progress-strip .bar>div{height:100%;background:linear-gradient(90deg,var(--amber),#F97316);border-radius:99px;transition:.5s cubic-bezier(.2,.8,.2,1)}
.progress-strip b{font-size:15px;font-weight:800}
.progress-strip small{color:var(--muted);font-size:12.5px;display:block}
.streak{display:flex;align-items:center;gap:6px;background:#FEF3C7;color:#B45309;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700}
.streak svg{width:14px;height:14px}

.side{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;max-height:calc(100vh - 64px);overflow:hidden}
@media(max-width:1000px){.side{border-left:none;border-top:1px solid var(--line);max-height:none}}
.side-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.side-head h2{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.side-head h2 svg{color:var(--amber)}
.side-head .cnt{font-size:12px;color:var(--muted);font-weight:600}
.side-body{flex:1;overflow-y:auto;padding:8px}
.side-body::-webkit-scrollbar{width:6px}
.side-body::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px}

.chapter{padding:8px 0}
.chapter-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 16px 6px}
.vitem{display:flex;gap:12px;padding:10px 14px;border-radius:11px;cursor:pointer;transition:.18s;align-items:flex-start;margin:2px 6px}
.vitem:hover{background:#F8FAFC}
.vitem.active{background:#FEF3C7}
.vitem.active .vt-title{color:#92400E}
.vitem .thumb{width:88px;height:52px;border-radius:8px;background:#0F172A;flex-shrink:0;overflow:hidden;position:relative}
.vitem .thumb img{width:100%;height:100%;object-fit:cover;opacity:.85}
.vitem .thumb .dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.85);color:#fff;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px}
.vitem .thumb .tick{position:absolute;inset:0;background:rgba(16,185,129,.85);display:grid;place-items:center}
.vitem .thumb .tick svg{width:22px;height:22px;stroke:#fff;stroke-width:3.5}
.vitem .thumb .vt-mini{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,.4)}
.vitem .thumb .vt-mini>div{height:100%;background:var(--amber)}
.vitem .vt{flex:1;min-width:0}
.vitem .vt-title{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vitem .vt-meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vitem .vt-meta .pv{display:flex;align-items:center;gap:4px;color:var(--amber);font-weight:700}
.vitem .vt-meta .resume{color:var(--sky);font-weight:700;display:flex;align-items:center;gap:3px}

.side-foot{padding:16px 20px;border-top:1px solid var(--line);background:#F8FAFC}
.mini-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.mini-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.mini-stat b{font-size:18px;font-weight:800;display:block;letter-spacing:-.01em}
.mini-stat small{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase}
.reset-btn{width:100%;padding:8px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--rose);background:#FEF2F2;border:1px solid #FECACA;transition:.2s}
.reset-btn:hover{background:#FEE2E2}

.resume-banner{position:fixed;bottom:22px;left:22px;right:22px;max-width:560px;margin:0 auto;background:#0F172A;color:#fff;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-lg);z-index:150;transform:translateY(140%);transition:.4s cubic-bezier(.2,.8,.2,1)}
.resume-banner.show{transform:translateY(0)}
.resume-banner .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--amber),#EA580C);display:grid;place-items:center;flex-shrink:0}
.resume-banner .ic svg{stroke:#fff;width:22px;height:22px}
.resume-banner .txt{flex:1;min-width:0}
.resume-banner .txt b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.resume-banner .txt small{font-size:12.5px;color:#94A3B8}
.resume-banner button{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700}
.resume-banner .go{background:var(--amber);color:#fff}
.resume-banner .no{background:rgba(255,255,255,.1);color:#fff}

.toast{position:fixed;bottom:22px;right:22px;background:#0F172A;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;z-index:300;transform:translateY(140%);transition:.4s cubic-bezier(.2,.8,.2,1);max-width:340px}
.toast.show{transform:translateY(0)}
.toast svg{color:var(--emerald);flex-shrink:0;width:18px;height:18px}
</style>
</head>
<body>

<nav class="nav">
  <div class="container">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="#" class="nav-back" onclick="goBack(event)">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> กลับ
      </a>
      <a href="#" class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg></span>
        Baan English Landa
      </a>
    </div>
    <div class="user-chip"><span class="av">ส</span><span>คุณสมชาย</span></div>
  </div>
</nav>

<div class="classroom">
  <div class="stage">
    <div class="player-wrap" id="playerWrap">
      <div id="ytPlayer"></div>
      <div class="player-skeleton" id="playerSkeleton">
        <div class="spinner"></div><span>กำลังโหลดวิดีโอ...</span>
      </div>
      <a href="#" class="yt-fallback hidden" id="ytFallback" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        เปิดใน YouTube
      </a>
    </div>

    <div class="lesson-info">
      <div class="crumb" id="crumb">คอร์ส • บทเรียน</div>
      <h1 id="lessonTitle">กำลังโหลด...</h1>
      <div class="meta" id="lessonMeta"></div>
      <p class="desc" id="lessonDesc"></p>
    </div>

    <div class="progress-strip">
      <div class="bar"><div id="courseBar" style="width:0%"></div></div>
      <div style="min-width:90px">
        <b id="courseBarText">0 / 0 บท</b>
        <small>ความคืบหน้าคอร์ส</small>
      </div>
      <div class="streak" id="streakChip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s4 4 4 8-2 4-2 6 2 4 2 4h-8s-2-2-2-4 2-2 2-6-2-8-2-8 2 2 6 2 6-2 6-2z"/></svg>
        <span id="streakText">0 วันติด</span>
      </div>
    </div>
  </div>

  <aside class="side">
    <div class="side-head">
      <h2><svg class="icon" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> บทเรียนทั้งหมด</h2>
      <span class="cnt" id="playlistCount">0 บท</span>
    </div>
    <div class="side-body" id="playlist"></div>
    <div class="side-foot">
      <div class="mini-stats">
        <div class="mini-stat"><b id="msDone">0</b><small>จบ</small></div>
        <div class="mini-stat"><b id="msWatch">0m</b><small>ดูแล้ว</small></div>
        <div class="mini-stat"><b id="msPct">0%</b><small>คืบหน้า</small></div>
      </div>
      <button class="reset-btn" onclick="resetProgress()">🗑 รีเซ็ตความคืบหน้า (Demo)</button>
    </div>
  </aside>
</div>

<div class="resume-banner" id="resumeBanner">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
  <div class="txt"><b>ดูต่อจากเดิมไหม?</b><small id="resumeText">บทที่...</small></div>
  <button class="go" onclick="resumePlay()">ดูต่อ</button>
  <button class="no" onclick="dismissResume()">ปิด</button>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">เรียบร้อย</span>
</div>

<script>
/* ============================================================
   COURSE DATA — ใช้ YouTube Video ID จริง 100%
   ทุกวิดีโอเป็นภาษาอังกฤษฟรีจากช่องที่มีชื่อเสียง
   ============================================================ */
const COURSE = {
  id: 'eng-real-01',
  title: 'English from Real YouTube — เรียนจริงจากช่องดัง',
  chapters: [
    {
      title: 'บทที่ 1: BBC Learning English',
      items: [
        {
          id: 'v1',
          title: 'BOX SET: English In A Minute 1 — 10 บทเรียนสั้น',
          youtubeId: 'v2VrFflFFLc',
          duration: '10:00',
          desc: 'ซีรีส์ "English In A Minute" รวมบทเรียนสั้น 10 คลิป จาก BBC Learning English สอนวลีและไวยากรณ์ที่ใช้บ่อยในชีวิตประจำวัน',
          channel: 'BBC Learning English'
        },
        {
          id: 'v2',
          title: 'BOX SET: English In A Minute 2 — 10 บทเรียนสั้น',
          youtubeId: 'tg1Vp-8Tr9o',
          duration: '10:00',
          desc: 'ต่อเนื่องจากชุดแรก เรียนรู้คำศัพท์และสำนวนเพิ่มเติมที่เจ้าของภาษาพูดจริง',
          channel: 'BBC Learning English'
        }
      ]
    },
    {
      title: 'บทที่ 2: English with Lucy',
      items: [
        {
          id: 'v3',
          title: '12 Tenses in 1 Hour — ไวยากรณ์ครบ 12 Tenses',
          youtubeId: 'y3v0z2L7k8c',
          duration: '60:00',
          desc: 'Lucy สรุปไวยากรณ์ภาษาอังกฤษทั้ง 12 Tenses ในคลิปเดียว พร้อมตัวอย่างและแบบทดสอบ',
          channel: 'English with Lucy'
        },
        {
          id: 'v4',
          title: '5-Day Shadowing Challenge Day 2 — Grammar',
          youtubeId: 'pbWBnGycAOo',
          duration: '18:00',
          desc: 'แบบฝึก Shadowing วันที่ 2 เน้นไวยากรณ์ระดับ B1-C1 พร้อมแบบฝึกหัด',
          channel: 'English with Lucy'
        }
      ]
    },
    {
      title: 'บทที่ 3: Speak English with Vanessa',
      items: [
        {
          id: 'v5',
          title: 'How to Stop Translating in Your Head',
          youtubeId: 'iW0h3f0y8wY',
          duration: '06:00',
          desc: 'Vanessa สอนวิธีหยุดแปลในหัว คิดเป็นภาษาอังกฤษโดยตรง เพื่อพูดได้คล่องขึ้น',
          channel: 'Speak English with Vanessa'
        },
        {
          id: 'v6',
          title: '3 Ways to Order in a Restaurant',
          youtubeId: 'K7Yk0w3jG7c',
          duration: '05:00',
          desc: 'วิธีสั่งอาหารในร้านอาหารเป็นภาษาอังกฤษ 3 รูปแบบ พร้อมบทสนทนาตัวอย่าง',
          channel: 'Speak English with Vanessa'
        }
      ]
    },
    {
      title: 'บทที่ 4: mmmEnglish',
      items: [
        {
          id: 'v7',
          title: 'How to use SOME & ANY — ไวยากรณ์',
          youtubeId: 'rRk9EhDcQp4',
          duration: '12:00',
          desc: 'Emma อธิบายการใช้ SOME และ ANY ที่ถูกต้อง พร้อมกฎและข้อยกเว้นที่ต้องรู้',
          channel: 'mmmEnglish'
        },
        {
          id: 'v8',
          title: '3 Pronunciation Tips for Past Tense Verbs',
          youtubeId: 'x9Xy9zQ5w6c',
          duration: '12:00',
          desc: '3 กฎการออกเสียง -ed ท้ายกริยาช่อง 2 ที่เจ้าของภาษาพูดจริง ฝึกออกเสียงให้ถูกต้อง',
          channel: 'mmmEnglish'
        }
      ]
    }
  ]
};

// Flatten
const ALL_LESSONS = [];
COURSE.chapters.forEach((ch, ci) => {
  ch.items.forEach((it, ii) => {
    it.chapterIndex = ci;
    it.itemIndex = ii;
    it.flatIndex = ALL_LESSONS.length;
    ALL_LESSONS.push(it);
  });
});

/* ============================================================
   STORAGE
   ============================================================ */
const STORAGE_KEY = 'baanenglish_real_v2';
const STREAK_KEY = 'baanenglish_streak_v2';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { lessons: {}, lastPlayed: null, totalWatchSec: 0 };
    return JSON.parse(raw);
  }catch(e){ return { lessons: {}, lastPlayed: null, totalWatchSec: 0 }; }
}
function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();

function getStreak(){
  try{
    const raw = localStorage.getItem(STREAK_KEY);
    if(!raw) return { count: 0, lastDate: null };
    return JSON.parse(raw);
  }catch(e){ return { count: 0, lastDate: null }; }
}
function updateStreak(){
  const s = getStreak();
  const today = new Date().toDateString();
  if(s.lastDate === today) return s.count;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  s.count = (s.lastDate === yesterday) ? s.count + 1 : 1;
  s.lastDate = today;
  localStorage.setItem(STREAK_KEY, JSON.stringify(s));
  return s.count;
}

/* ============================================================
   STATE
   ============================================================ */
let player = null;
let currentIndex = 0;
let tickInterval = null;
let pendingResume = null;

/* ============================================================
   YOUTUBE API
   ============================================================ */
function loadYTApi(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  const first = document.getElementsByTagName('script')[0];
  first.parentNode.insertBefore(tag, first);
  window.onYouTubeIframeAPIReady = cb;
}

function createPlayer(videoId, startSec){
  document.getElementById('playerSkeleton').classList.remove('hidden');
  document.getElementById('ytFallback').classList.add('hidden');

  if(player && player.destroy){ try{ player.destroy(); }catch(e){} player = null; }

  const playerEl = document.createElement('div');
  playerEl.id = 'ytPlayer';
  document.getElementById('ytPlayer').replaceWith(playerEl);

  player = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars: { rel:0, modestbranding:1, playsinline:1, start:Math.floor(startSec||0), origin:location.origin },
    events: {
      onReady: (e) => {
        document.getElementById('playerSkeleton').classList.add('hidden');
        e.target.playVideo();
        startTracking();
      },
      onStateChange: onPlayerStateChange,
      onError: (e) => {
        console.warn('YT error', e.data);
        document.getElementById('playerSkeleton').classList.add('hidden');
        document.getElementById('ytFallback').classList.remove('hidden');
        document.getElementById('ytFallback').href = 'https://www.youtube.com/watch?v=' + videoId;
        showToast('วิดีโอนี้ไม่อนุญาตให้เล่นในเว็บ กด "เปิดใน YouTube"');
      }
    }
  });
}

function onPlayerStateChange(e){
  if(e.data === 0){
    const lesson = ALL_LESSONS[currentIndex];
    markComplete(lesson.id, true);
    showToast('✓ จบบทแล้ว! กำลังไปบทต่อไป...');
    stopTracking();
    setTimeout(() => {
      if(currentIndex < ALL_LESSONS.length - 1) loadLesson(currentIndex + 1);
      else showToast('🎉 จบคอร์สทั้งหมดแล้ว!');
    }, 1200);
  }
  if(e.data === 1){ startTracking(); updateStreak(); refreshStreakUI(); }
  if(e.data === 2){ stopTracking(); saveCurrentTime(); }
}

/* ============================================================
   TRACKING — 综合完成度算法
   规则：观看 ≥80% 才标记为“已完成”
   ============================================================ */
function startTracking(){
  stopTracking();
  tickInterval = setInterval(saveCurrentTime, 5000);
}
function stopTracking(){ if(tickInterval){ clearInterval(tickInterval); tickInterval = null; } }

function saveCurrentTime(){
  if(!player || !player.getCurrentTime) return;
  try{
    const t = player.getCurrentTime();
    const d = player.getDuration();
    if(!d || d <= 0) return;
    const lesson = ALL_LESSONS[currentIndex];
    if(!progress.lessons[lesson.id]) progress.lessons[lesson.id] = {};
    const L = progress.lessons[lesson.id];
    const prev = L.watchedSec || 0;
    if(t > prev) progress.totalWatchSec = (progress.totalWatchSec || 0) + (t - prev);
    L.watchedSec = t;
    L.duration = d;
    L.pct = Math.min(100, Math.round((t / d) * 100));
    L.lastSeen = Date.now();
    // ✅ 关键改动：80% 才算完成
    if(L.pct >= 80 && !L.completed) {
      L.completed = true;
      showToast('✓ บทนี้เรียนจบแล้ว!');
    }
    progress.lastPlayed = { lessonId: lesson.id, t: t };
    saveProgress(progress);
    updateSidebarUI();
    updateCourseProgressUI();
    updateMiniStats();
  }catch(e){}
}

/* ============================================================
   LOAD LESSON
   ============================================================ */
function loadLesson(idx){
  if(idx < 0 || idx >= ALL_LESSONS.length) return;
  currentIndex = idx;
  const lesson = ALL_LESSONS[idx];

  document.getElementById('crumb').textContent = `บทที่ ${lesson.chapterIndex+1} • ${lesson.title.split(' — ')[0] || 'บทเรียน'}`;
  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonMeta').innerHTML = `
    <span><svg class="icon" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>${lesson.channel}</span>
    <span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${lesson.duration}</span>
    <span>🎯 บทที่ ${idx+1} / ${ALL_LESSONS.length}</span>
  `;
  document.getElementById('lessonDesc').textContent = lesson.desc;

  const L = progress.lessons[lesson.id] || {};
  const startSec = (L.watchedSec && L.pct < 95) ? L.watchedSec : 0;

  loadYTApi(() => createPlayer(lesson.youtubeId, startSec));
  updateSidebarUI();
  updateCourseProgressUI();
  updateMiniStats();
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function updateSidebarUI(){
  const box = document.getElementById('playlist');
  let html = '';
  COURSE.chapters.forEach((ch, ci) => {
    html += `<div class="chapter"><div class="chapter-title">บทที่ ${ci+1} • ${ch.title.replace(/^บทที่ \d+: /,'')}</div>`;
    ch.items.forEach((it) => {
      const L = progress.lessons[it.id] || {};
      const pct = L.pct || 0;
      const done = L.completed;
      const resume = L.watchedSec && pct < 95 && !done;
      const active = ALL_LESSONS[currentIndex] && ALL_LESSONS[currentIndex].id === it.id;
      html += `
        <div class="vitem ${active?'active':''}" onclick="loadLesson(${it.flatIndex})">
          <div class="thumb">
            <img src="https://img.youtube.com/vi/${it.youtubeId}/mqdefault.jpg" loading="lazy" alt="${it.title}" onerror="this.style.opacity=0"/>
            ${done ? `<div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`:''}
            ${!done ? `<span class="dur">${it.duration}</span>`:''}
            ${pct>0 && !done ? `<div class="vt-mini"><div style="width:${pct}%"></div></div>`:''}
          </div>
          <div class="vt">
            <div class="vt-title">${it.title}</div>
            <div class="vt-meta">
              ${done ? `<span class="pv" style="color:var(--emerald)">✓ เรียนจบแล้ว</span>`
                : (resume ? `<span class="resume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>ดูต่อ ${fmtTime(L.watchedSec)}</span><span style="color:var(--amber);font-weight:700">${pct}%</span>`
                : `<span>▶ ยังไม่เริ่ม</span>`)}
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  box.innerHTML = html;
  document.getElementById('playlistCount').textContent = ALL_LESSONS.length + ' บท';
}

/* ============================================================
   PROGRESS UI
   ============================================================ */
function updateCourseProgressUI(){
  const done = ALL_LESSONS.filter(l => (progress.lessons[l.id]||{}).completed).length;
  const total = ALL_LESSONS.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('courseBar').style.width = pct + '%';
  document.getElementById('courseBarText').textContent = `${done} / ${total} บท`;
}
function updateMiniStats(){
  const done = ALL_LESSONS.filter(l => (progress.lessons[l.id]||{}).completed).length;
  const total = ALL_LESSONS.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('msDone').textContent = done;
  document.getElementById('msWatch').textContent = Math.round((progress.totalWatchSec||0)/60) + 'm';
  document.getElementById('msPct').textContent = pct + '%';
}
function refreshStreakUI(){
  const s = getStreak();
  document.getElementById('streakText').textContent = s.count + ' วันติด';
}

/* ============================================================
   UTILS
   ============================================================ */
function fmtTime(sec){
  if(!sec || sec<0) return '0:00';
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}

function markComplete(lessonId, silent){
  if(!progress.lessons[lessonId]) progress.lessons[lessonId] = {};
  progress.lessons[lessonId].completed = true;
  progress.lessons[lessonId].pct = 100;
  saveProgress(progress);
  updateSidebarUI();
  updateCourseProgressUI();
  updateMiniStats();
  if(!silent) showToast('✓ ทำเครื่องหมายว่าเรียนจบแล้ว');
}

/* ============================================================
   RESUME
   ============================================================ */
function checkResume(){
  const lp = progress.lastPlayed;
  if(!lp || !lp.t || lp.t < 10) return;
  const lesson = ALL_LESSONS.find(l => l.id === lp.lessonId);
  if(!lesson) return;
  if(progress.lessons[lp.lessonId] && progress.lessons[lp.lessonId].completed) return;
  pendingResume = { lessonId: lp.lessonId, t: lp.t };
  document.getElementById('resumeText').textContent = `${lesson.title} • ดูค้างไว้ที่ ${fmtTime(lp.t)}`;
  document.getElementById('resumeBanner').classList.add('show');
}
function resumePlay(){
  if(!pendingResume) return;
  const idx = ALL_LESSONS.findIndex(l => l.id === pendingResume.lessonId);
  if(idx >= 0) loadLesson(idx);
  dismissResume();
}
function dismissResume(){
  document.getElementById('resumeBanner').classList.remove('show');
  pendingResume = null;
}

/* ============================================================
   RESET
   ============================================================ */
function resetProgress(){
  if(!confirm('ล้างความคืบหน้าทั้งหมด?')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(STREAK_KEY);
  progress = loadProgress();
  loadLesson(0);
  showToast('ล้างข้อมูลแล้ว');
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
function goBack(e){ e.preventDefault(); history.length > 1 ? history.back() : null; }

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const lp = progress.lastPlayed;
  let startIdx = 0;
  if(lp){
    const i = ALL_LESSONS.findIndex(l => l.id === lp.lessonId);
    if(i >= 0 && !(progress.lessons[lp.lessonId]||{}).completed) startIdx = i;
  }
  loadLesson(startIdx);
  updateSidebarUI();
  updateMiniStats();
  updateStreak();
  refreshStreakUI();
  setTimeout(checkResume, 2000);
  window.addEventListener('beforeunload', () => { saveCurrentTime(); saveProgress(progress); });
  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.key === 'ArrowRight' && currentIndex < ALL_LESSONS.length - 1) loadLesson(currentIndex + 1);
    if(e.key === 'ArrowLeft' && currentIndex > 0) loadLesson(currentIndex - 1);
  });
});
</script>
