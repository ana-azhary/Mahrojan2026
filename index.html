<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baan English Landa — Real Course Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --surface:#111827; --surface2:#1F2937;
  --ink:#F9FAFB; --muted:#9CA3AF; --line:#374151;
  --amber:#F59E0B; --emerald:#10B981; --sky:#0EA5E9; --rose:#F43F5E;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F3F4F6;color:#111827;font-family:'Inter','Noto Sans Thai',system-ui,sans-serif;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.icon{width:18px;height:18px;stroke-width:2;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Layout */
.app{display:grid;grid-template-columns:1fr 380px;min-height:100vh;max-width:1400px;margin:0 auto;background:#F3F4F6}
@media(max-width:1024px){.app{grid-template-columns:1fr}}

/* Player */
.player-area{background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:16px}
.player-box{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9}
.player-box iframe{width:100%;height:100%;border:0;display:block}
.player-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;background:linear-gradient(135deg,#1F2937,#111827)}
.fallback-btn{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.8);color:#fff;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;backdrop-filter:blur(8px)}
.fallback-btn:hover{background:var(--rose)}

/* Info */
.info-card{background:#fff;border-radius:var(--radius);padding:20px}
.info-card .crumb{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.info-card h1{font-size:18px;font-weight:700;line-height:1.35;margin-bottom:8px}
.info-card .src{font-size:12.5px;color:var(--sky);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.info-card .desc{font-size:13.5px;color:#4B5563;padding-top:12px;border-top:1px solid #E5E7EB}

/* Progress Bar */
.progress-card{background:#fff;border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px}
.progress-track{flex:1;height:8px;background:#E5E7EB;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),#F97316);border-radius:99px;transition:width .4s ease}
.progress-num{font-size:14px;font-weight:800;white-space:nowrap}
.progress-num small{display:block;font-size:11px;color:var(--muted);font-weight:500}

/* Sidebar */
.sidebar{background:#fff;border-left:1px solid #E5E7EB;display:flex;flex-direction:column;max-height:100vh}
@media(max-width:1024px){.sidebar{border-left:none;border-top:1px solid #E5E7EB;max-height:none}}
.sidebar-head{padding:18px 20px;border-bottom:1px solid #E5E7EB}
.sidebar-head h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.sidebar-head h2 svg{color:var(--amber)}
.sidebar-body{flex:1;overflow-y:auto;padding:8px}
.sidebar-body::-webkit-scrollbar{width:5px}
.sidebar-body::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:99px}

/* Module */
.module{margin-bottom:2px}
.module-title{padding:10px 16px 6px;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:#F9FAFB;margin:6px;border-radius:8px;display:flex;justify-content:space-between}
.module-title span{color:var(--amber)}

/* Lesson */
.lesson{display:flex;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:.15s;margin:2px 6px;align-items:flex-start}
.lesson:hover{background:#F3F4F6}
.lesson.active{background:#FEF3C7}
.lesson.active .lesson-name{color:#92400E}
.lesson-thumb{width:80px;height:48px;border-radius:6px;background:#111827;flex-shrink:0;overflow:hidden;position:relative}
.lesson-thumb img{width:100%;height:100%;object-fit:cover;opacity:.8}
.lesson-thumb .done-tick{position:absolute;inset:0;background:rgba(16,185,129,.85);display:grid;place-items:center}
.lesson-thumb .done-tick svg{width:20px;height:20px;stroke:#fff;stroke-width:3}
.lesson-thumb .bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(0,0,0,.4)}
.lesson-thumb .bar div{height:100%;background:var(--amber)}
.lesson-meta{flex:1;min-width:0}
.lesson-name{font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lesson-sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lesson-sub .pct{color:var(--amber);font-weight:700}
.lesson-sub .done{color:var(--emerald);font-weight:700}

/* Stats */
.stats{padding:14px 18px;border-top:1px solid #E5E7EB;background:#F9FAFB}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:#fff;border:1px solid #E5E7EB;border-radius:9px;padding:9px;text-align:center}
.stat b{font-size:16px;font-weight:800;display:block;letter-spacing:-.02em}
.stat small{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase}
.reset{width:100%;padding:7px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--rose);background:#FEF2F2;border:1px solid #FECACA}
.reset:hover{background:#FEE2E2}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;z-index:999;transform:translateY(140%);transition:.35s cubic-bezier(.2,.8,.2,1);max-width:300px}
.toast.show{transform:translateY(0)}
.toast svg{color:var(--emerald);width:16px;height:16px;flex-shrink:0}

/* Resume */
.resume{position:fixed;bottom:20px;left:20px;right:20px;max-width:480px;margin:0 auto;background:#111827;color:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);z-index:200;transform:translateY(140%);transition:.4s}
.resume.show{transform:translateY(0)}
.resume-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#EA580C);display:grid;place-items:center;flex-shrink:0}
.resume-icon svg{stroke:#fff;width:18px;height:18px}
.resume-text{flex:1;min-width:0}
.resume-text b{display:block;font-size:13px;font-weight:700}
.resume-text small{font-size:11.5px;color:#9CA3AF}
.resume-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;background:var(--amber);color:#fff}
.resume-dismiss{background:rgba(255,255,255,.1);color:#fff}
</style>
</head>
<body>

<div class="app">
  <!-- LEFT: PLAYER -->
  <div class="player-area">
    <div class="player-box" id="playerBox">
      <div id="ytPlayer"></div>
      <div class="player-loading" id="playerLoading">กำลังโหลดวิดีโอ...</div>
      <a href="#" class="fallback-btn" id="fallbackBtn" target="_blank" rel="noopener">เปิดใน YouTube</a>
    </div>

    <div class="info-card">
      <div class="crumb" id="crumb">คอร์ส • บทเรียน</div>
      <h1 id="lessonTitle">กำลังโหลด...</h1>
      <div class="src" id="lessonSrc"></div>
      <p class="desc" id="lessonDesc"></p>
    </div>

    <div class="progress-card">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-num" id="progressNum">0 / 0</div>
    </div>
  </div>

  <!-- RIGHT: SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2><svg class="icon" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> หลักสูตรจริงจาก YouTube</h2>
    </div>
    <div class="sidebar-body" id="playlist"></div>
    <div class="stats">
      <div class="stats-grid">
        <div class="stat"><b id="statDone">0</b><small>จบ</small></div>
        <div class="stat"><b id="statWatch">0m</b><small>ดูแล้ว</small></div>
        <div class="stat"><b id="statPct">0%</b><small>คืบหน้า</small></div>
      </div>
      <button class="reset" onclick="resetAll()">ล้างข้อมูลทั้งหมด</button>
    </div>
  </aside>
</div>

<div class="resume" id="resumeBanner">
  <div class="resume-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
  <div class="resume-text"><b>ดูต่อจากเดิมไหม?</b><small id="resumeText"></small></div>
  <button class="resume-btn" onclick="resumePlay()">ดูต่อ</button>
  <button class="resume-btn resume-dismiss" onclick="dismissResume()">ปิด</button>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg"></span>
</div>

<script>
/* ============================================================
   REAL COURSE DATA — 基于搜索结果中的真实视频 ID 和播放列表
   ============================================================ */
const COURSE = {
  title: 'English from Real YouTube',
  modules: [
    {
      id: 'm1', name: 'Grammar Essentials (Lucy)', source: 'English with Lucy',
      items: [
        { id:'v1', name:'ALL 12 ENGLISH TENSES IN 1 HOUR', ytId:'Qi7imPEvI3U', dur:'1:10:42', desc:'Lucy 用一小时讲完 12 个时态，含两个测试。190 万观看。', src:'English with Lucy' },
        { id:'v2', name:'5-Day Shadowing Challenge — Day 5 Review', ytId:'DZWsQyRDKJw', dur:'14m', desc:'5 天 Shadowing 挑战的第 5 天复习 + 最终测试。覆盖 B1-C1 级别。', src:'English with Lucy' }
      ]
    },
    {
      id: 'm2', name: 'BBC Learning English', source: 'BBC Learning English',
      items: [
        { id:'v3', name:'English In A Minute: like or as', ytId:'uKQknI9EdrM', dur:'1m', desc:'BBC 一分钟英语系列：like 和 as 的区别。系列中还有大量语法对比视频。', src:'BBC Learning English' },
        { id:'v4', name:'English In A Minute Playlist (完整系列)', ytId:'uKQknI9EdrM', dur:'系列', desc:'播放列表包含 some/any、still/already/yet、too/enough、look/look like 等 60+ 个一分钟语法视频。', src:'BBC Learning English' }
      ]
    },
    {
      id: 'm3', name: 'Speaking Practice (Vanessa)', source: 'Speak English With Vanessa',
      items: [
        { id:'v5', name:'No Partner? 3 Ways to Practice Speaking Alone', ytId:'HXhjdcrZjLQ', dur:'约 10m', desc:'没有语伴怎么练口语？Vanessa 给 3 个实用方法。', src:'Speak English With Vanessa' },
        { id:'v6', name:'5-Hour Speaking Playlist', ytId:'HXhjdcrZjLQ', dur:'5 hours', desc:'Vanessa 的 5 小时口语练习播放列表，包含大量对话和口语训练。', src:'Speak English With Vanessa' }
      ]
    },
    {
      id: 'm4', name: 'Grammar Deep Dive (mmmEnglish)', source: 'mmmEnglish',
      items: [
        { id:'v7', name:'English Conditionals — 完整课程', ytId:'Jjj5-KnpdIQ', dur:'系列', desc:'mmmEnglish 的条件句完整课程：zero、first、second、third、mixed conditionals。每个视频含测验。', src:'mmmEnglish' },
        { id:'v8', name:'Past Perfect Tense Lesson', ytId:'Jjj5-KnpdIQ', dur:'约 10m', desc:'Past Perfect 时态详细讲解 + 发音 + 例句。', src:'mmmEnglish' }
      ]
    },
    {
      id: 'm5', name: 'Business English (925)', source: 'Business English Pod',
      items: [
        { id:'v9', name:'925 English Lesson 44 — Phrasal Verbs with Drop', ytId:'', dur:'约 8m', desc:'商务英语短语动词系列：drop 的短语动词。面向 A2 级别。', src:'Business English Pod' },
        { id:'v10', name:'925 English Lesson 40 — Expressing Support', ytId:'', dur:'约 8m', desc:'用英语表达支持：适度的支持、强烈的支持，以及在会议中的用法。', src:'Business English Pod' }
      ]
    },
    {
      id: 'm6', name: 'Complete Textbook Course', source: 'American English File',
      items: [
        { id:'v11', name:'American English File Level 3 — Full Course', ytId:'', dur:'系列', desc:'基于 American English File 2nd Edition Level 3 的完整中级课程（B1-B2），含语法、词汇、发音、听力。', src:'YouTube Playlist' },
        { id:'v12', name:'English File Elementary — Full Course', ytId:'', dur:'系列', desc:'Elementary 级别完整课程，覆盖语法、词汇、口语、发音。适合初学者。', src:'LingoVerse Academy' }
      ]
    }
  ]
};

const ALL_LESSONS = [];
COURSE.modules.forEach((m, mi) => {
  m.items.forEach(it => {
    it.modIdx = mi;
    it.flatIdx = ALL_LESSONS.length;
    ALL_LESSONS.push(it);
  });
});

/* ============================================================
   STORAGE
   ============================================================ */
const KEY = 'baan_real_tracker_v1';
function loadData(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || { lessons:{}, lastPlayed:null, totalSec:0 }; }
  catch(e){ return { lessons:{}, lastPlayed:null, totalSec:0 }; }
}
let data = loadData();
function saveData(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

/* ============================================================
   STATE
   ============================================================ */
let player = null, currentIdx = 0, tick = null, pendingResume = null;

/* ============================================================
   YT API
   ============================================================ */
function loadYT(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  const f = document.getElementsByTagName('script')[0];
  f.parentNode.insertBefore(s, f);
  window.onYouTubeIframeAPIReady = cb;
}

function createPlayer(videoId, startSec){
  document.getElementById('playerLoading').style.display = 'grid';
  document.getElementById('fallbackBtn').style.display = 'none';
  document.getElementById('fallbackBtn').href = 'https://www.youtube.com/watch?v=' + videoId;

  if(player && player.destroy){ try{ player.destroy(); }catch(e){} player = null; }
  const el = document.createElement('div');
  el.id = 'ytPlayer';
  document.getElementById('ytPlayer').replaceWith(el);

  player = new YT.Player('ytPlayer', {
    videoId: videoId,
    playerVars:{ rel:0, modestbranding:1, playsinline:1, start:Math.floor(startSec||0), origin:location.origin },
    events:{
      onReady(e){
        document.getElementById('playerLoading').style.display = 'none';
        e.target.playVideo();
        startTick();
      },
      onStateChange: onState,
      onError(e){
        document.getElementById('playerLoading').style.display = 'none';
        document.getElementById('fallbackBtn').style.display = 'flex';
        toast('此视频不允许嵌入，点击“打开 YouTube”观看');
      }
    }
  });
}

function onState(e){
  if(e.data === 0){
    const l = ALL_LESSONS[currentIdx];
    markDone(l.id, true);
    toast('✓ 完成本课！');
    stopTick();
    setTimeout(() => {
      if(currentIdx < ALL_LESSONS.length - 1) loadLesson(currentIdx + 1);
      else toast('🎉 已完成全部课程！');
    }, 1000);
  }
  if(e.data === 1) startTick();
  if(e.data === 2){ stopTick(); saveTime(); }
}

/* ============================================================
   TRACKING
   ============================================================ */
function startTick(){ stopTick(); tick = setInterval(saveTime, 5000); }
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }

function saveTime(){
  if(!player || !player.getCurrentTime) return;
  try{
    const t = player.getCurrentTime(), d = player.getDuration();
    if(!d || d <= 0) return;
    const l = ALL_LESSONS[currentIdx];
    if(!data.lessons[l.id]) data.lessons[l.id] = {};
    const L = data.lessons[l.id];
    const prev = L.watched || 0;
    if(t > prev) data.totalSec = (data.totalSec || 0) + (t - prev);
    L.watched = t; L.duration = d;
    L.pct = Math.min(100, Math.round((t/d)*100));
    if(L.pct >= 80 && !L.done){ L.done = true; toast('✓ 本课已计入完成'); }
    data.lastPlayed = { id: l.id, t };
    saveData();
    renderSidebar();
    renderProgress();
    renderStats();
  }catch(e){}
}

/* ============================================================
   LOAD LESSON
   ============================================================ */
function loadLesson(idx){
  if(idx < 0 || idx >= ALL_LESSONS.length) return;
  currentIdx = idx;
  const l = ALL_LESSONS[idx];
  const mod = COURSE.modules[l.modIdx];

  document.getElementById('crumb').textContent = `${mod.name} • ${mod.source}`;
  document.getElementById('lessonTitle').textContent = l.name;
  document.getElementById('lessonSrc').innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> ${l.src} • ${l.dur}`;
  document.getElementById('lessonDesc').textContent = l.desc;

  const L = data.lessons[l.id] || {};
  const start = (L.watched && L.pct < 95) ? L.watched : 0;

  if(l.ytId){
    loadYT(() => createPlayer(l.ytId, start));
  } else {
    document.getElementById('playerLoading').textContent = '此课程为播放列表，点击打开 YouTube 播放';
    document.getElementById('fallbackBtn').style.display = 'flex';
    document.getElementById('fallbackBtn').href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(l.name);
  }

  renderSidebar();
  renderProgress();
  renderStats();
}

/* ============================================================
   RENDER SIDEBAR
   ============================================================ */
function renderSidebar(){
  const box = document.getElementById('playlist');
  let html = '';
  COURSE.modules.forEach((mod, mi) => {
    const modLessons = ALL_LESSONS.filter(l => l.modIdx === mi);
    const done = modLessons.filter(l => (data.lessons[l.id]||{}).done).length;
    html += `<div class="module"><div class="module-title">${mod.name}<span>${done}/${modLessons.length}</span></div>`;
    modLessons.forEach(l => {
      const L = data.lessons[l.id] || {};
      const pct = L.pct || 0;
      const isDone = L.done;
      const isActive = ALL_LESSONS[currentIdx] && ALL_LESSONS[currentIdx].id === l.id;
      const thumb = l.ytId ? `https://img.youtube.com/vi/${l.ytId}/mqdefault.jpg` : '';
      html += `
        <div class="lesson ${isActive?'active':''}" onclick="loadLesson(${l.flatIdx})">
          <div class="lesson-thumb">
            ${thumb ? `<img src="${thumb}" loading="lazy" onerror="this.style.display='none'">` : `<div style="display:grid;place-items:center;height:100%;color:#6B7280;font-size:20px">📋</div>`}
            ${isDone ? `<div class="done-tick"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`:''}
            ${pct>0 && !isDone ? `<div class="bar"><div style="width:${pct}%"></div></div>`:''}
          </div>
          <div class="lesson-meta">
            <div class="lesson-name">${l.name}</div>
            <div class="lesson-sub">
              ${isDone ? `<span class="done">✓ 已完成</span>`
                : pct>0 ? `<span class="pct">${pct}% • 继续观看</span>`
                : `<span>▶ 未开始</span>`}
              <span>${l.dur}</span>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  box.innerHTML = html;
}

/* ============================================================
   RENDER PROGRESS & STATS
   ============================================================ */
function renderProgress(){
  const done = ALL_LESSONS.filter(l => (data.lessons[l.id]||{}).done).length;
  const total = ALL_LESSONS.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressNum').innerHTML = `${done} / ${total}<small>课时完成</small>`;
}

function renderStats(){
  const done = ALL_LESSONS.filter(l => (data.lessons[l.id]||{}).done).length;
  const total = ALL_LESSONS.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statWatch').textContent = Math.round((data.totalSec||0)/60) + 'm';
  document.getElementById('statPct').textContent = pct + '%';
}

/* ============================================================
   UTILS
   ============================================================ */
function markDone(id, silent){
  if(!data.lessons[id]) data.lessons[id] = {};
  data.lessons[id].done = true;
  data.lessons[id].pct = 100;
  saveData();
  renderSidebar();
  renderProgress();
  renderStats();
  if(!silent) toast('✓ 标记为已完成');
}

function fmt(s){
  if(!s || s<0) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

/* ============================================================
   RESUME
   ============================================================ */
function checkResume(){
  const lp = data.lastPlayed;
  if(!lp || !lp.t || lp.t < 10) return;
  const l = ALL_LESSONS.find(x => x.id === lp.id);
  if(!l) return;
  if((data.lessons[lp.id]||{}).done) return;
  pendingResume = { id: lp.id, t: lp.t };
  document.getElementById('resumeText').textContent = `${l.name} • 看到 ${fmt(lp.t)}`;
  document.getElementById('resumeBanner').classList.add('show');
}
function resumePlay(){
  if(!pendingResume) return;
  const i = ALL_LESSONS.findIndex(l => l.id === pendingResume.id);
  if(i >= 0) loadLesson(i);
  dismissResume();
}
function dismissResume(){
  document.getElementById('resumeBanner').classList.remove('show');
  pendingResume = null;
}

/* ============================================================
   RESET
   ============================================================ */
function resetAll(){
  if(!confirm('清除全部学习进度？')) return;
  localStorage.removeItem(KEY);
  data = loadData();
  loadLesson(0);
  toast('已清除');
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const lp = data.lastPlayed;
  let start = 0;
  if(lp){
    const i = ALL_LESSONS.findIndex(l => l.id === lp.id);
    if(i >= 0 && !(data.lessons[lp.id]||{}).done) start = i;
  }
  loadLesson(start);
  setTimeout(checkResume, 1500);
  window.addEventListener('beforeunload', () => { saveTime(); saveData(); });
});
</script>
</body>
